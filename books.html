<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Information</title>
</head>
<body>

    <h1>Book Information</h1>

    <p id="status">Loading book data...</p>
    <section id="bookDetails"></section>

    <script>
        async function loadBooks() {
            const status = document.getElementById("status");
            const bookDetails = document.getElementById("bookDetails");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Failed to load JSON");
                }

                const data = await response.json();

                // (a) Title of the first book
                const firstTitle = document.createElement("p");
                firstTitle.textContent =
                    "Title of first book: " + data.books[0].title;

                bookDetails.appendChild(firstTitle);

                // (b) Author of the second book
                const secondAuthor = document.createElement("p");
                secondAuthor.textContent =
                    "Author of second book: " + data.books[1].author;

                bookDetails.appendChild(secondAuthor);

                // (c) Genres of both books
                data.books.forEach((book) => {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    bookDetails.appendChild(paragraph);
                });

                status.textContent = "Data loaded successfully.";

            } catch (error) {
                status.textContent =
                    "Unable to load book data. Please check the JSON file.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
